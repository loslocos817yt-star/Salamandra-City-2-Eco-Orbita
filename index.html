<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salamandra City 2: Eco-Órbita</title>
    <link rel="icon" type="image/png" href="assets/menu/favicon.png">
    <style>
        body, html { margin: 0; padding: 0; background-color: #000; overflow: hidden; color: white; font-family: sans-serif; height: 100vh; width: 100vw; }
        #panoramaCanvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; }

        #auth-overlay, #overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }

        #menu-container { position: absolute; left: 6%; top: 50%; transform: translateY(-50%); z-index: 10; display: flex; flex-direction: column; align-items: center; max-width: 45%; }
        .logo-game { width: 85vw; max-width: 500px; margin-bottom: 25px; filter: drop-shadow(0px 0px 25px rgba(255, 204, 0, 0.6)); }

        input { padding: 15px; margin: 10px; border-radius: 10px; border: none; width: 250px; font-size: 1.2em; color: #000; display: block; }
        button { padding: 18px 50px; font-size: 1.4em; background: #ffcc00; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; color: black; box-shadow: 0 5px 15px rgba(255, 204, 0, 0.4); margin-top: 10px; }

        .btn-menu { margin-top: 15px; width: 100%; max-width: 300px; }
        #logoutBtn { background: #ff3333; color: white; box-shadow: 0 5px 15px rgba(255, 51, 51, 0.4); }

        #leaderboard-container {
            position: absolute; right: 6%; top: 50%; transform: translateY(-50%); z-index: 10;
            background: rgba(0, 0, 0, 0.85); border: 2px solid #ffcc00; border-radius: 12px;
            padding: 20px; width: 35vw; max-width: 400px; max-height: 65vh; overflow-y: auto;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
        }
        #leaderboard-container h2 { margin-top: 0; color: #ffcc00; text-align: center; font-size: 1.6em; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,204,0,0.5); }

        .tabla-ranking { width: 100%; border-collapse: collapse; text-align: left; font-size: 1.1em; }
        .tabla-ranking th { color: #ffcc00; border-bottom: 2px solid #ffcc00; padding: 8px; }
        .tabla-ranking td { padding: 10px 8px; border-bottom: 1px solid #333; line-height: 1.4em; }
        .top-row { color: #ffcc00; font-weight: bold; }
        #user-profile { position: absolute; top: 20px; right: 20px; background: rgba(0, 0, 0, 0.85); border: 2px solid #ffcc00; border-radius: 12px; padding: 15px; z-index: 105; display: none; text-align: right; box-shadow: 0 0 15px rgba(255, 204, 0, 0.4); }
        #user-profile p { margin: 5px 0; font-size: 1.1em; }
        #user-profile .icon { font-size: 2.2em; float: right; margin-left: 15px; }
        #user-profile span { color: #ffcc00; font-weight: bold; }
        .btn-logout-small { background: #ff3333; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; margin-top: 10px; font-weight: bold; box-shadow: 0 3px 10px rgba(255, 51, 51, 0.4); }
    </style>
</head>
<body>
    <audio id="menuMusic" loop>
        <source src="assets/music/solarflex-space-541545.mp3" type="audio/mpeg">
    </audio>

    <canvas id="panoramaCanvas"></canvas>

    <div id="user-profile">
        <div class="icon">👤</div>
        <p>Piloto: <span id="profile-name">-</span></p>
        <p>Tiempo: <span id="profile-score">-</span>s</p>
        <p>Rango: <span id="profile-rank">-</span></p>
        <button class="btn-logout-small" onclick="cerrarSesion()">CERRAR SESIÓN</button>
    </div>
    <div id="auth-overlay">
        <h1>Entrar a Salamandra City</h1>
        <input type="text" id="username" placeholder="Nombre de usuario">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="autenticar()">Ingresar / Registrarse</button>
    </div>

    <div id="overlay" style="display:none;">
        <img src="assets/menu/logo.png" class="logo-game">
        <button id="fullBtn">INICIAR JUEGO</button>
    </div>

    <div id="menu-container">
        <img src="assets/menu/logo.png" class="logo-game">
        <button id="jugarBtn" class="btn-menu">JUGAR (SOLO)</button>
        <button id="serverBtn" class="btn-menu" onclick="pedirServidor()">SERVIDOR MULTIJUGADOR</button>
        <button id="rankBtn" class="btn-menu" onclick="toggleLeaderboard()">CLASIFICACIÓN</button>
    </div>

    <div id="leaderboard-container" style="display: none;">
        <h2>TOP JUGADORES</h2>
        <table class="tabla-ranking">
            <thead>
                <tr><th>Pos</th><th>Jugador</th><th>Tiempo</th></tr>
            </thead>
            <tbody id="leaderboard-body">
                <tr><td colspan='3' style='text-align:center;'>Cargando...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const USER = "loslocos817yt-star";
        const REPO = "sc2EO-server";
        const FILE_PATH = "Players.json";
        const API_URL = `https://api.github.com/repos/${USER}/${REPO}/contents/${FILE_PATH}`;

        const P1 = "Z2hwXw==";
        const P2 = "MWJNeTU3ZmhHNVREQWtSSnBhSVp1aUNGM0JsR21RMWJWR2tB";
        const GH_TOKEN = atob(P1) + atob(P2);

        // Iniciar música de menú
        document.body.addEventListener('click', () => {
            const music = document.getElementById('menuMusic');
            if (music.paused) {
                music.volume = 0.5;
                music.play().catch(e => console.log("Esperando interacción para audio"));
            }
        }, { once: true });

        async function actualizarPerfil() {
            const user = localStorage.getItem("sc2_user");
            if (!user) return;
            document.getElementById("user-profile").style.display = "block";
            document.getElementById("profile-name").innerText = user;
            try {
                const res = await fetch(API_URL + "?t=" + Date.now(), { headers: { "Authorization": "token " + GH_TOKEN } });
                if (!res.ok) return;
                const data = await res.json();
                let content = {};
                if (data.content) content = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                const usuariosOrdenados = Object.entries(content).map(([nombre, val]) => {
                    return [nombre, typeof val === "number" ? val : val.time];
                }).sort((a, b) => b[1] - a[1]);
                let rank = usuariosOrdenados.findIndex(u => u[0] === user) + 1;
                let score = content[user] ? (typeof content[user] === "number" ? content[user] : content[user].time) : 0;
                document.getElementById("profile-score").innerText = score;
                document.getElementById("profile-rank").innerText = rank > 0 ? "#" + rank : "N/A";
            } catch(e) { console.error("Error cargando perfil:", e); }
        }

        function restaurarAuth() {
            document.getElementById('auth-overlay').innerHTML = `
                <h1>Entrar a Salamandra City</h1>
                <input type="text" id="username" placeholder="Nombre de usuario">
                <input type="password" id="password" placeholder="Contraseña">
                <button onclick="autenticar()">Ingresar / Registrarse</button>
            `;
        }

        async function autenticar() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (!user || !pass) {
                alert("Debes poner usuario y contraseña");
                return;
            }

            document.getElementById('auth-overlay').innerHTML = "<h2>Conectando al servidor...</h2>";

            try {
                const res = await fetch(API_URL + "?t=" + Date.now(), { headers: { 'Authorization': 'token ' + GH_TOKEN } });
                if (!res.ok) throw new Error("Error leyendo base de datos.");
                const data = await res.json();

                let content = {};
                if (data.content) {
                    content = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                }

                if (content[user] !== undefined) {
                    if (typeof content[user] === 'number') {
                        content[user] = { pwd: pass, time: content[user] };
                    } else if (content[user].pwd !== pass) {
                        alert("Contraseña incorrecta o usuario ya en uso.");
                        restaurarAuth();
                        return;
                    }
                } else {
                    content[user] = { pwd: pass, time: 0 };
                }

                const putRes = await fetch(API_URL, {
                    method: 'PUT',
                    headers: { 'Authorization': 'token ' + GH_TOKEN, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: "Auth update para: " + user,
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))),
                        sha: data.sha
                    })
                });

                if (putRes.ok) {
                    localStorage.setItem('sc2_user', user);
                    document.getElementById('auth-overlay').style.display = 'none';
                    document.getElementById('overlay').style.display = 'flex';
                    actualizarPerfil();
                } else {
                    const errInfo = await putRes.json();
                    alert("Falló al actualizar: " + errInfo.message);
                    restaurarAuth();
                }

            } catch (e) {
                alert("Error de red: " + e.message);
                restaurarAuth();
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('sc2_user');
            document.getElementById("user-profile").style.display = "none";
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('leaderboard-container').style.display = 'none';
            restaurarAuth();
            document.getElementById('auth-overlay').style.display = 'flex';
        }

        async function toggleLeaderboard() {
            const container = document.getElementById('leaderboard-container');
            if (container.style.display === 'none') {
                await cargarLeaderboard();
                container.style.display = 'block';
            } else {
                container.style.display = 'none';
            }
        }

        async function cargarLeaderboard() {
            try {
                const tbody = document.getElementById('leaderboard-body');
                tbody.innerHTML = "<tr><td colspan='3' style='text-align:center;'>Actualizando...</td></tr>";

                const res = await fetch(API_URL + "?t=" + Date.now(), { headers: { 'Authorization': 'token ' + GH_TOKEN } });
                if (!res.ok) return;
                const data = await res.json();

                let content = {};
                if (data.content) {
                    content = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                }

                const usuariosOrdenados = Object.entries(content).map(([nombre, val]) => {
                    let tiempo = typeof val === 'number' ? val : val.time;
                    return [nombre, tiempo];
                }).sort((a, b) => b[1] - a[1]);

                tbody.innerHTML = "";
                if (usuariosOrdenados.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='3' style='text-align:center;'>No hay registros aún</td></tr>";
                    return;
                }

                usuariosOrdenados.forEach(([nombre, tiempo], index) => {
                    const fila = document.createElement('tr');
                    const esTop = index < 3 ? "class='top-row'" : "";
                    let badge = `#${index + 1}`;
                    if (index === 0) badge = "🏆";
                    else if (index === 1) badge = "🥈";
                    else if (index === 2) badge = "🥉";

                    fila.innerHTML = `<td ${esTop}>${badge}</td><td ${esTop}>${nombre}</td><td>${tiempo}s</td>`;
                    tbody.appendChild(fila);
                });

            } catch (e) {
                console.error("Error Leaderboard:", e);
            }
        }

        // --- LÓGICA DE MULTIJUGADOR DESDE EL MENÚ ---
        function pedirServidor() {
            let urlGuardada = localStorage.getItem('sc2_server_url') || 'ws://localhost:8765';
            let urlServer = prompt("Ingresa la URL del servidor Termux (ej: ws://192.168.1.100:8765):", urlGuardada);

            if (urlServer) {
                urlServer = urlServer.trim();
                localStorage.setItem('sc2_server_url', urlServer);

                // Mandamos al usuario al juego con la URL en los parámetros
                window.location.href = `game.html?server=${encodeURIComponent(urlServer)}`;
            }
        }

        document.getElementById('jugarBtn').onclick = () => {
            // Modo Solo
            window.location.href = 'game.html';
        };

        const canvas = document.getElementById('panoramaCanvas');
        const ctx = canvas.getContext('2d');
        const bgImg = new Image();
        bgImg.src = 'assets/texturas/cielos/Blue_Nebula_01-512x512.png';
        let scrollX = 0;

        function draw() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            if(bgImg.complete) {
                const imgWidth = (canvas.height / bgImg.height) * bgImg.width;
                scrollX -= 0.5;
                if(scrollX <= -imgWidth) scrollX = 0;
                for(let x = scrollX; x < canvas.width; x += imgWidth) ctx.drawImage(bgImg, x, 0, imgWidth, canvas.height);
            }
            requestAnimationFrame(draw);
        }
        window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        window.onresize();
        bgImg.onload = draw;

        document.getElementById('fullBtn').onclick = async () => {
            try {
                if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
                if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape').catch(() => {});
            } catch (e) {}
            document.getElementById('overlay').style.display = 'none';
        };

        window.onload = () => {
            if (localStorage.getItem('sc2_user')) {
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('overlay').style.display = 'flex';
                actualizarPerfil();
            }
        };
    </script>
</body>
</html>
